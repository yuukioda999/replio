services:
  api:
    build:
      context: ./backend
    environment:
      PORT: "8080"
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      CLAUDE_MAX_TOKENS: ${CLAUDE_MAX_TOKENS:-512}
      GENERATION_ENABLED: "true"
      GENERATION_MAX_REQUESTS_PER_HOUR: ${GENERATION_MAX_REQUESTS_PER_HOUR:-10}
      GENERATION_MAX_CONCURRENT: ${GENERATION_MAX_CONCURRENT:-2}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      GO_API_ORIGIN: http://api:8080
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
