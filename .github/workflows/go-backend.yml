name: Goバックエンドのテスト

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/go-backend.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/go-backend.yml"

permissions:
  contents: read

jobs:
  test:
    name: Goテストと静的解析
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: コードを取得
        uses: actions/checkout@v4
      - name: Goをセットアップ
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.mod
      - name: Goテストを実行
        run: go test ./...
      - name: 静的解析を実行
        run: go vet ./...
